<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Manajemen Mahasiswa</title>
    <!-- CSS Utama (menggantikan Tailwind CSS) -->
    <link href="./src/style/styles.css" rel="stylesheet">
    <!-- Custom CSS Dashboard -->
    <link href="./src/style/dashboard.css" rel="stylesheet">
</head>
<body style="background-color: var(--gray-100);">

    <div class="dashboard-container">

        <!-- Kartu Statistik -->
        <div class="stats-grid" id="statsCards">
            <!-- diisi JS -->
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-tabs" id="filterTabs">
                <button data-filter="all" class="tab-filter tab-filter-active">Semua Data</button>
                <button data-filter="laki" class="tab-filter">Laki-laki</button>
                <button data-filter="perempuan" class="tab-filter">Perempuan</button>
            </div>
            <div class="filter-actions">
                <input type="text" id="searchInput" placeholder="Cari NIM atau Nama..." class="search-input">
                <button id="exportExcelBtn" class="btn btn-green">Export Excel</button>
                <button id="exportWordBtn" class="btn btn-blue">Export Word</button>
                <button id="openModalBtn" class="btn btn-indigo">+ Tambah Mahasiswa</button>
            </div>
        </div>

        <!-- Tabel -->
        <div class="table-card">
            <div class="table-header">
                <h2 class="table-title">Daftar Mahasiswa</h2>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead class="table-head">
                        <tr>
                            <th>NIM</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th style="text-align: center;">JK</th>
                            <th style="text-align: center;">Tanggal Lahir</th>
                            <th style="text-align: center;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="table-body">
                        <tr><td colspan="6" style="text-align: center; padding: 2.5rem; color: var(--gray-400);">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div class="table-footer">
                <p id="infoJumlah" class="pagination-info">Menampilkan 0 dari 0 data</p>
                <div class="pagination-controls">
                    <button id="prevPage" class="btn-pagination">Sebelumnya</button>
                    <span id="pageIndicator" class="pagination-info">Halaman 1</span>
                    <button id="nextPage" class="btn-pagination">Berikutnya</button>
                </div>
            </div>
            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="loading-indicator hidden">
                <div class="spinner"></div>
                <p>Memuat data...</p>
            </div>
            <!-- End Message -->
            <div id="endMessage" class="end-message hidden">
                <p>✓ Semua data sudah ditampilkan</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" class="modal-title">Tambah Mahasiswa</h3>
                <button id="closeModalBtn" class="modal-close">&times;</button>
            </div>
            <form id="mahasiswaForm" class="modal-form">
                <input type="hidden" id="editNim" value="">
                
                <!-- Row 1: NIM dan Nama -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">NIM</label>
                        <input type="text" id="nim" required class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" id="nama" required class="form-input">
                    </div>
                </div>
                
                <!-- Alamat -->
                <div class="form-group">
                    <label class="form-label">Alamat</label>
                    <textarea id="alamat" rows="3" required class="form-input"></textarea>
                </div>
                
                <!-- Jenis Kelamin -->
                <div class="form-group">
                    <label class="form-label">Jenis Kelamin</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="jk" value="Laki-laki" checked>
                            <span>Laki-laki</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="jk" value="Perempuan">
                            <span>Perempuan</span>
                        </label>
                    </div>
                </div>
                
                <!-- Tanggal Lahir -->
                <div class="form-group">
                    <label class="form-label">Tanggal Lahir</label>
                    <div class="date-select-group">
                        <select id="tgl" required class="form-select"></select>
                        <select id="bln" required class="form-select">
                            <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                            <option value="04">Apr</option><option value="05">Mei</option><option value="06">Jun</option>
                            <option value="07">Jul</option><option value="08">Ags</option><option value="09">Sep</option>
                            <option value="10">Okt</option><option value="11">Nov</option><option value="12">Des</option>
                        </select>
                        <select id="thn" required class="form-select"></select>
                    </div>
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required class="form-input">
                        <button type="button" id="togglePassword" class="btn-toggle-password">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="icon-eye" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Buttons -->
                <div class="form-actions">
                    <button type="button" id="cancelModalBtn" class="btn btn-cancel">Batal</button>
                    <button type="submit" class="btn btn-save">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notifikasi Toast -->
    <div id="dashboardNotification" class="notification-toast"></div>

    <script src="./src/js/dashboard.js"></script>
</body>
</html>

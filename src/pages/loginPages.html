<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Mahasiswa</title>
    <!-- CSS Utama (menggantikan Tailwind CSS) -->
    <link href="./src/style/styles.css" rel="stylesheet">
    <!-- Custom CSS untuk form -->
    <link href="./src/style/login.css" rel="stylesheet">
</head>
    <body style="background-color: var(--gray-50);">

    <div class="login-container">
        <div class="login-card">

        <div class="login-header">
            <h1 class="login-title">Registrasi Mahasiswa</h1>
            <p class="login-subtitle">Silakan isi data diri Anda dengan lengkap</p>
        </div>

        <form id="registerForm" class="login-form">
            <!-- NIM -->
            <div class="form-group">
                <label for="nim" class="form-label">NIM</label>
                <input type="text" id="nim" name="nim" required 
                       class="form-input"
                       placeholder="Contoh: 202412004">
            </div>

            <!-- Nama Lengkap -->
            <div class="form-group">
                <label for="nama" class="form-label">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required 
                       class="form-input"
                       placeholder="Contoh: Hana">
            </div>

            <!-- Alamat -->
            <div class="form-group">
                <label for="alamat" class="form-label">Alamat</label>
                <textarea id="alamat" name="alamat" rows="2" required 
                          class="form-input"
                          placeholder="Jl. GajahMada No.02, Kota Bontang"></textarea>
            </div>

            <!-- Jenis Kelamin (hanya Laki-laki & Perempuan) -->
            <div class="form-group">
                <label class="form-label">Jenis Kelamin</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="jk" value="Laki-laki" checked>
                        <span>Laki-laki</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="jk" value="Perempuan">
                        <span>Perempuan</span>
                    </label>
                </div>
            </div>

            <!-- Tanggal Lahir -->
            <div class="form-group">
                <label class="form-label">Tanggal Lahir</label>
                <div class="date-select-group">
                    <select id="tanggal" name="tanggal" required class="form-select">
                        <option value="">Tanggal</option>
                    </select>
                    <select id="bulan" name="bulan" required class="form-select">
                        <option value="">Bulan</option>
                        <option value="01">Januari</option><option value="02">Februari</option><option value="03">Maret</option>
                        <option value="04">April</option><option value="05">Mei</option><option value="06">Juni</option>
                        <option value="07">Juli</option><option value="08">Agustus</option><option value="09">September</option>
                        <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
                    </select>
                    <select id="tahun" name="tahun" required class="form-select">
                        <option value="">Tahun</option>
                    </select>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div>
                    <input type="password" id="password" name="password" required 
                           class="form-input"
                           placeholder="Minimal 6 karakter">
                </div>
            </div>

            <!-- Submit Button -->
            <div class="form-button-wrapper">
                <button type="submit" class="btn-submit">
                    Submit
                </button>
            </div>
        </form>

        </div>
    </div>

    <!-- Notifikasi Toast Modern -->
    <div id="notification" class="notification-toast"></div>

    <!-- JavaScript eksternal -->
    <script src="./src/js/login.js"></script>
</body>
</html>

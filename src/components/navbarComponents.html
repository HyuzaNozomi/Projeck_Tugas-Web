<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Kaca (Glassmorphism)</title>
    <link href="/src/style/output.css" rel="stylesheet">
    <link href="/src/style/navbar.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<nav id="navbar" class="fixed top-4 left-4 right-4 z-50 rounded-full transition-all duration-300">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between flex-wrap">
        <a href="#" class="brand-logo text-gray-800 text-xl font-bold tracking-wide">MyApp</a>
        <button id="menu-btn" class="block md:hidden text-gray-800 focus:outline-none hover:bg-white/30 p-2 rounded-lg transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
        <div id="menu" class="w-full md:flex md:w-auto md:items-center md:mt-0 space-y-2 md:space-y-0 md:space-x-1">
            <a href="#" id="nav-dashboard" class="nav-link block text-sm font-medium">Dashboard</a>
            <a href="#" id="nav-login" class="nav-link block text-sm font-medium">Registrasi</a>
        </div>
    </div>
</nav>

<script src="../js/navbar.js"></script>
</body>
</html>
